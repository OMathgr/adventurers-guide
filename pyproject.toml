[project]
name = "adventurers-guide"
version = "0.2.0"
description = "Motor de regras de Daggerheart e API do Adventurer's Guide"
requires-python = ">=3.10"
# o motor (motor/) é Python puro; estas dependências são da API (api/)
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
