    <meta charset="UTF-8" />

    <title>Adventurer's Guide</title>
    <!-- vale em todas as telas, inclusive as sem login, e sem piscar o escuro ao abrir:
         o tema que a pessoa escolheu; enquanto não escolher, o do sistema -->
    <script>
      let salvo = null
      try { salvo = localStorage.getItem('ag.tema') } catch { /* modo privado */ }
      const sistemaClaro = window.matchMedia?.('(prefers-color-scheme: light)').matches
      if (salvo === 'claro' || (!salvo && sistemaClaro)) document.documentElement.dataset.tema = 'claro'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
